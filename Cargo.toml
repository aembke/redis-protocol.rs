[package]
authors = ["Alec Embke <aembke@gmail.com>"]
description = "An implementation of the RESP2 and RESP3 protocols."
keywords = ["redis", "protocol", "RESP", "no_std"]
license = "MIT OR Apache-2.0"
name = "redis-protocol"
readme = "README.md"
repository = "https://github.com/aembke/redis-protocol.rs"
version = "6.1.0"
edition = "2021"
rust-version = "1.88"
exclude = ["fuzz", ".circleci", "benches"]

[package.metadata.docs.rs]
features = [
    "bytes",
    "std",
    "codec",
    "convert",
    "resp2",
    "resp3"
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = { version = "1.1", default-features = false, optional = true }
bytes-utils = { version = "0.1", default-features = false, optional = true }
crc16 = { version = "0.4" }
memchr = { version = "2", default-features = false }
indexmap = { version = "2.2", default-features = false, optional = true }
log = "0.4"
nom = { version = "8.0", default-features = false }
hashbrown = { version = "0.17", optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }

[dev-dependencies]
rand = "0.8"
tokio = { version = "1.36", features = ["full"] }
pretty_env_logger = "0.5"
futures = "0.3"
itertools = "0.12"
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["std", "resp2", "resp3"]
resp2 = []
resp3 = []
# `IndexMap` only has a default hasher with `indexmap/std`, so this requires `std`.
index-map = ["dep:indexmap", "indexmap/std", "std"]
hashbrown = ["dep:hashbrown"]
bytes = ["dep:bytes", "dep:bytes-utils"]
decode-logs = []
std = ["nom/std", "memchr/std"]
codec = ["dep:tokio-util", "bytes", "std"]
convert = []

[lib]
doc = true
doctest = true
name = "redis_protocol"
test = true

[[bench]]
name = "decode"
harness = false
required-features = ["resp2", "resp3"]

[[bench]]
name = "encode"
harness = false
required-features = ["resp2", "resp3"]

# compares the ways `extend_encode` could reserve space. run with `RUSTFLAGS="--cfg redis_protocol_bench"`.
[[bench]]
name = "reserve"
harness = false
required-features = ["resp2", "resp3", "bytes"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(redis_protocol_bench)"] }
