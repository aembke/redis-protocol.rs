version: 2

jobs:
  build-docs:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Install nightly
          command: rustup install nightly
      - run:
          name: Build documentation
          command: tests/doc.sh
  tests-codec:
    machine:
      image: ubuntu-2204:2022.10.2
      docker_layer_caching: true
    resource_class: medium
    environment:
      REDIS_VERSION: 7.2.4
    steps:
      - checkout
      - run:
          name: Run tests with codec features
          command: source tests/environ && tests/codec/runner.sh
  tests-bytes:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Run tests with bytes features
          command: cargo test --release --features "resp2 resp3 bytes codec convert" --lib
  tests-no-bytes:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Run tests without bytes or bytes_utils
          command: cargo test --release --features "resp2 resp3 convert" --lib
  tests-no-std:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Run tests without std
          command: cargo test --release --no-default-features --features "resp2 resp3 bytes" --lib
  clippy-lint:
    docker:
      - image: cimg/rust:1.88
    environment:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - checkout
      - run:
          name: Clippy
          command: cargo clippy --features "bytes convert codec std resp2 resp3" --lib --tests --benches -- -Dwarnings
      - run:
          name: Clippy with all features
          command: cargo clippy --all-features --lib --tests --benches -- -Dwarnings
      - run:
          name: Clippy without std
          command: cargo clippy --no-default-features --features "resp2 resp3 convert bytes" --lib -- -Dwarnings
  build-no-std:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Add cross compile target
          command: rustup target add thumbv7m-none-eabi
      - run:
          name: Verifies successful build for no_std target
          command: cargo build --release --no-default-features --features resp2,resp3,convert,bytes --target=thumbv7m-none-eabi
  tests-doc:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Run doc tests
          command: cargo test --doc --all-features
  check-features:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Install cargo-hack
          command: curl -LsSf https://github.com/taiki-e/cargo-hack/releases/latest/download/cargo-hack-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C ~/.cargo/bin
      - run:
          name: Check feature combinations
          command: cargo hack check --feature-powerset --no-dev-deps --exclude-features default --at-least-one-of resp2,resp3
  check-fuzz:
    docker:
      - image: cimg/rust:1.88
    steps:
      - checkout
      - run:
          name: Check fuzz targets
          command: cd fuzz && cargo check --bins

workflows:
  version: 2
  build:
    jobs:
      - tests-bytes
      - tests-no-bytes
      - tests-codec
      - tests-no-std
      - build-no-std
      - clippy-lint
      - build-docs
      - tests-doc
      - check-features
      - check-fuzz