[package]
name = "redis-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
log = "0.4"
pretty_env_logger = "0.5"

[dependencies.redis-protocol]
path = ".."
features = ["std", "bytes", "codec", "resp2", "resp3", "decode-logs"]

[[bin]]
name = "resp2_owned"
path = "fuzz_targets/resp2_owned.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp2_bytes"
path = "fuzz_targets/resp2_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp3_owned"
path = "fuzz_targets/resp3_owned.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp3_bytes"
path = "fuzz_targets/resp3_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp2_scan"
path = "fuzz_targets/resp2_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp3_scan"
path = "fuzz_targets/resp3_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp2_roundtrip"
path = "fuzz_targets/resp2_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp3_roundtrip"
path = "fuzz_targets/resp3_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp3_codec"
path = "fuzz_targets/resp3_codec.rs"
test = false
doc = false
bench = false
